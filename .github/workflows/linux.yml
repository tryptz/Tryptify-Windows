name: Linux checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Native tests, unit tests, headless smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev libglu1-mesa-dev libx11-dev libxext-dev xvfb mesa-utils

      - name: Configure native build
        run: cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release "-DTF_OUTPUT_DIR=${{ github.workspace }}/app/resources/linux-x64"

      - name: Build native libraries
        run: cmake --build build/native

      - name: Run native host tests
        run: ctest --test-dir build/native --output-on-failure

      - name: Native sanitizer suite
        run: native/dsp/tests/run_host_tests.sh

      - name: Unit tests
        run: ./gradlew --no-daemon :app:test

      - name: Headless smoke run
        env:
          TRYPTIFY_SMOKE: '1'
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew --no-daemon :app:run
